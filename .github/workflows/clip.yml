name: clip
# Manual-trigger clipper. Takes a YouTube URL, extracts top viral moments, scores them against the
# strict gates, auto-decides shorts vs long format, and uploads the final deliverable(s) as a job
# artifact. All compute happens on GitHub-hosted runners — the user's Mac does nothing.
#
# Trigger (locally, from the yt-autopilot checkout):
#   gh workflow run clip.yml -f url="https://www.youtube.com/watch?v=XXXXXXXXXXX"
#   gh workflow run clip.yml -f url="https://..." -f format=shorts
#   gh workflow run clip.yml -f url="https://..." -f format=long
#
# Legal: downloads a video the user did not necessarily create. The user has accepted copyright
# responsibility for this project.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL to clip"
        required: true
      format:
        description: "Output format"
        type: choice
        options:
          - auto
          - shorts
          - long
        default: auto
      lang:
        description: "Caption language (default: en)"
        required: false
        default: "en"

concurrency:
  group: clip
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install system deps (ffmpeg, yt-dlp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # yt-dlp from PyPI — fresher than the Ubuntu-packaged version, which lags YouTube changes.
          pip install --upgrade yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1

      - name: Install auto-editor
        run: |
          pip install --upgrade auto-editor
          auto-editor --version | head -1

      - run: npm ci --no-audit --no-fund

      - name: Clipper build
        env:
          # Writes-role calls go to Mistral; same wiring as local .env but sourced from secrets so
          # the key never lives in the repo. All provided as GitHub Actions secrets by the user.
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL_HEAVY: ministral-14b-2512
          MISTRAL_MODEL_LIGHT: ministral-8b-2512
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_HEAVY: ${{ secrets.GEMINI_MODEL_HEAVY || 'gemini-2.5-flash' }}
          GEMINI_MODEL_LIGHT: ${{ secrets.GEMINI_MODEL_LIGHT || 'gemini-2.5-flash' }}
          LLM_ROLE_WRITE: mistral
          LLM_ROLE_GATE: mistral
          LLM_ROLE_JUDGE: mistral
        run: |
          npm run clip:build -- "${{ github.event.inputs.url }}" \
            --format "${{ github.event.inputs.format }}" \
            --lang "${{ github.event.inputs.lang }}" \
            --out work/clipper

      - name: Collect outputs
        if: always()
        run: |
          # Grab the latest run's final + manifest for the artifact bundle.
          LATEST=$(ls -1dt work/clipper/*/ 2>/dev/null | head -1)
          echo "LATEST=$LATEST" >> $GITHUB_ENV
          echo "Latest run: $LATEST"
          ls -la "$LATEST/final" 2>/dev/null || true
          cat "$LATEST/manifest.json" 2>/dev/null | head -200 || true

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: |
            ${{ env.LATEST }}/final/
            ${{ env.LATEST }}/manifest.json
          retention-days: 7
          if-no-files-found: warn
