name: clip-pipeline
# 5-job pipeline — Mac does ONLY the download step; everything else runs on free Ubuntu.
#
# discover (ubuntu) → plan (ubuntu) → fetch (self-hosted mac) → process (ubuntu) → pending-review (ubuntu)
#
# Trigger:
#   gh workflow run clip-pipeline.yml                               # auto-discover top-1
#   gh workflow run clip-pipeline.yml -f top_n=1
#   gh workflow run clip-pipeline.yml -f url=https://youtu.be/X     # bypass discovery

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Specific YouTube URL (overrides discovery)"
        required: false
      top_n:
        description: "How many picks to process when auto-discovering"
        required: false
        default: "1"
      format:
        description: "Output format"
        type: choice
        options:
          - auto
          - shorts
          - long
        default: auto
      max_height:
        description: "Max download resolution"
        required: false
        default: "1080"
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: clip-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:

  # ────────────── Job 1: discover (ubuntu, free) ──────────────────────────────
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.pick.outputs.url }}
      hasPick: ${{ steps.pick.outputs.hasPick }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # M7.2: Agent-Reach (Panniantong/Agent-Reach) — cross-platform mention signals (Reddit + web)
      # that boost the ranker for videos being discussed outside YouTube. Install is best-effort:
      # if any step fails the discover.ts helper (agent-reach.ts) degrades to zero mentions
      # (ENOENT on spawn) rather than failing the build.
      - name: Install uv + Agent-Reach
        continue-on-error: true
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install https://github.com/Panniantong/Agent-Reach/releases/latest/download/agent-reach.zip || {
            echo "Agent-Reach install failed; discover will skip cross-platform enrichment"
            exit 0
          }
          agent-reach --help 2>&1 | head -5 || true
      - name: Pick URL
        id: pick
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.url }}" ]]; then
            echo "url=${{ github.event.inputs.url }}" >> $GITHUB_OUTPUT
            echo "hasPick=1" >> $GITHUB_OUTPUT
          else
            TOPN="${{ github.event.inputs.top_n || '1' }}"
            npm run clip:discover -- --top-n "$TOPN"
            URL=$(node --input-type=module -e "import {readFileSync} from 'node:fs';const q=JSON.parse(readFileSync('data/clipper/queue.json','utf8'));const first=(q.picks||[])[0];console.log(first ? 'https://www.youtube.com/watch?v='+first.id : '');")
            if [[ -n "$URL" ]]; then
              echo "url=$URL" >> $GITHUB_OUTPUT
              echo "hasPick=1" >> $GITHUB_OUTPUT
            else
              echo "hasPick=0" >> $GITHUB_OUTPUT
            fi
          fi

  # ────────────── Job 2: plan — LLM pick (self-hosted mac, native browser cookies) ─────
  # Runs on the Mac because the caption fetch needs YouTube auth. Mac has Safari logged in, so we
  # use --cookies-from-browser safari (via YT_DLP_COOKIES_BROWSER env) — no secret needed, nothing
  # to refresh. Mac work: ~5s captions fetch + ~30-60s LLM call. Network-bound, no heat.
  plan:
    needs: discover
    if: needs.discover.outputs.hasPick == '1'
    runs-on: [self-hosted, mac-downloader]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          which yt-dlp || brew install yt-dlp
          node --version
      - run: npm ci --no-audit --no-fund
      - name: Plan clip windows
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_MODEL_HEAVY: ministral-14b-2512
          MISTRAL_MODEL_LIGHT: ministral-8b-2512
          GEMINI_MODEL_HEAVY: gemini-2.5-flash
          GEMINI_MODEL_LIGHT: gemini-2.5-flash
          LLM_PROVIDER: gemini
          LLM_ROLE_WRITE: mistral
          LLM_ROLE_GATE: mistral
          LLM_ROLE_JUDGE: mistral
          YT_DLP_COOKIES_BROWSER: firefox
        run: |
          mkdir -p work/clipper
          npx tsx scripts/clip-plan.ts --url "${{ needs.discover.outputs.url }}" --out work/clipper/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: work/clipper/plan.json

  # ────────────── Job 3: fetch — Mac downloads sections ONLY ──────────────────
  fetch:
    needs: plan
    runs-on: [self-hosted, mac-downloader]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/clipper
      - name: Deps (yt-dlp available via brew)
        run: |
          which yt-dlp || brew install yt-dlp
          node --version
      - run: npm ci --no-audit --no-fund
      - name: Download sections (yt-dlp only — Mac does nothing else)
        env:
          YT_DLP_COOKIES_BROWSER: firefox
        run: |
          npx tsx scripts/clip-fetch.ts --plan work/clipper/plan.json --out work/clipper/sections --max-height ${{ github.event.inputs.max_height || '1080' }}
      - uses: actions/upload-artifact@v4
        with:
          name: sections
          path: work/clipper/sections

  # ────────────── Job 4: process — polish/score/assemble (ubuntu, free) ───────
  process:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          # M6: mediapipe + opencv-headless for face-aware crop-safety and post-render QC.
          # M7.4: faster-whisper for burned-in speech captions. CPU int8 "base" model, ~30s per
          # 60s of audio on a 4-core runner. Model weights download on first use (~150MB).
          # Pinned mediapipe version avoids the brittle "latest" dependency conflicts we saw
          # in testing. opencv-python-headless skips the GUI libs we don't need on CI.
          pip install --upgrade auto-editor
          pip install 'mediapipe==0.10.14' 'opencv-python-headless==4.10.0.84' 'numpy<2'
          pip install 'faster-whisper==1.0.3'
          ffmpeg -version | head -1
          python3 -c "import mediapipe, cv2, faster_whisper; print('mediapipe', mediapipe.__version__, 'cv2', cv2.__version__, 'faster-whisper OK')"
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: sections
          path: work/clipper/sections
      - name: Process (snap, polish, score, decide, assemble)
        run: |
          npx tsx scripts/clip-process.ts --sections work/clipper/sections --out work/clipper --format "${{ github.event.inputs.format || 'auto' }}"
      - name: Commit outcomes.json + state updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clipper/outcomes.json data/clipper/reviewed.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "clipper: outcomes for run ${{ github.run_id }} [skip ci]"
          git push || true
      # Upload ONLY the final/ output + manifest.json — not the ~300 MB of intermediate
      # clips/ + snapped/ + polished/ files that balloon artifact size and slow user downloads.
      # The intermediates are still on the runner for debug; only ephemeral.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips-${{ github.run_id }}
          path: |
            work/clipper/final/
            work/clipper/manifest.json
          retention-days: 7
          if-no-files-found: warn

  # ────────────── Job 5: pending-review — open an issue (ubuntu) ──────────────
  pending-review:
    needs: process
    if: always() && needs.process.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: work/clipper
        continue-on-error: true
      - name: Open review issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MF="work/clipper/manifest.json"
          BODY=$(mktemp)
          if [[ -f "$MF" ]]; then
            TITLE=$(node --input-type=module -e "import {readFileSync} from 'node:fs';const m=JSON.parse(readFileSync('$MF','utf8'));console.log(m.source?.title ?? '(unknown)');")
            FMT=$(node --input-type=module -e "import {readFileSync} from 'node:fs';const m=JSON.parse(readFileSync('$MF','utf8'));console.log(m.decision?.format ?? '-');")
            OUT=$(node --input-type=module -e "import {readFileSync} from 'node:fs';const m=JSON.parse(readFileSync('$MF','utf8'));console.log((m.outputs ?? []).length);")
            RAT=$(node --input-type=module -e "import {readFileSync} from 'node:fs';const m=JSON.parse(readFileSync('$MF','utf8'));console.log(m.decision?.rationale ?? '');")
            {
              printf 'Clips ready for review in artifact clips-%s.\n\n' "$RUN_ID"
              printf '**Source:** %s\n' "$TITLE"
              printf '**Format:** %s (%s output files)\n' "$FMT" "$OUT"
              printf '**Reasoning:** %s\n\n' "$RAT"
              printf 'Comment /approve or /reject with the videoId to update state.json.\n\n'
              printf 'Run: https://github.com/%s/actions/runs/%s\n' "$REPO" "$RUN_ID"
            } > "$BODY"
          else
            printf '(no clips produced — all candidates dropped by gates)\n\nRun: https://github.com/%s/actions/runs/%s\n' "$REPO" "$RUN_ID" > "$BODY"
          fi
          gh label create clipper-review --color "f5a623" --description "Clips awaiting human review" 2>/dev/null || true
          gh issue create --title "clipper: review clips from run ${RUN_ID}" --body-file "$BODY" --label "clipper-review"
