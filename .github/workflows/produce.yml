name: produce
on:
  schedule:
    # 2 attempts per day, aligned to the audience's timezone (America/New_York).
    # 15:17 UTC = 10:17 ET: morning queue drain, finishes before US primetime.
    # 21:17 UTC = 16:17 ET: late-afternoon retry if the morning run failed or deferred.
    # Both avoid the top of the hour where GitHub drops/delays runs under load ("high load times
    # include the start of every hour" — Actions docs).
    # Reduced from 12/day because Remotion renders are 10–30 min each (vs. ffmpeg's ~2); over-
    # dispatching burns CI minutes without extra value when the queue is empty anyway.
    - cron: "17 15 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but do not upload (videos attached as artifact)"
        type: boolean
        default: true
      sub_niche:
        description: "Force a sub-niche id (optional)"
        required: false
      force:
        description: "Ignore the weekly failure cap"
        type: boolean
        default: false
concurrency: { group: produce, cancel-in-progress: false }
# actions: read lets a run download the render an earlier run saved when the final check was unavailable.
permissions: { contents: read, issues: write, actions: read }
jobs:
  produce:
    runs-on: ubuntu-latest
    # Bumped from 170 → 240 to accommodate Remotion render (10–30 min per video on 2-vCPU runner).
    # Our own PRODUCE_DEADLINE_MIN below stays conservative so we exit cleanly before this hard cap.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # fonts-noto + fonts-noto-color-emoji so Remotion themes (Inter, Noto Serif JP, emoji) render
      # correctly in headless Chromium. Without these, captions fall back to Deja Vu and emoji appear
      # as tofu boxes. libnss3/libatk/libasound2 are Chromium's own runtime deps.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto fonts-noto-color-emoji espeak-ng \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
      - run: npm ci
      # Install Remotion renderer deps (vendored at remotion-composer/, AGPLv3, see its NOTICE.md).
      # Separate node_modules so Remotion's React 18 doesn't collide with yt-autopilot's own deps.
      # First run downloads Chromium (~300MB) via @remotion/renderer; cached between runs by setup-node.
      - name: Install Remotion composer deps
        working-directory: remotion-composer
        run: npm ci --no-audit --no-fund
      - name: Install Claude Code CLI (only when using a Claude subscription)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        run: '[ "$LLM_PROVIDER" = "claude-code" ] && npm install -g @anthropic-ai/claude-code || echo "skipped"'
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: kokoro-v1-q8
      - run: npm run produce
        # Bumped from 160 → 230 for Remotion render time (10–30 min added per video).
        timeout-minutes: 230
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_SUB_NICHE: ${{ inputs.sub_niche }}
          FORCE_PRODUCE: ${{ inputs.force }}
          # Raised from 110 → 180 to accommodate Remotion renders. Still safely below the 230-min step
          # cap so we exit cleanly if a render stalls, instead of being killed mid-write.
          PRODUCE_DEADLINE_MIN: "180"
          PHASE_BUDGET_MS: "1200000"     # 20 min ceiling on the whole image phase
          SCENE_BUDGET_MS: "90000"       # 90s per scene, then pooled footage
          MIN_TOPIC_SCORE: "7.5"         # average across the six topic axes
          MIN_TOPIC_VISUAL: "0.7"        # share of visual subjects that must exist in stock libraries
          MIN_FEASIBLE: "0.6"            # share of scenes with a findable picture
          SHOT_SECS_H: "7"               # target shot length, long video
          SHOT_SECS_V: "3.5"             # target shot length, Short
          # `npm run github` pushes .env values as SECRETS, so secrets must be read first — reading
          # only `vars` silently ignored everything you configured locally.
          # Jobs go to whoever is best at them: Mistral for volume and long output, Gemini kept
          # for the two stages that must SEE pixels.
          LLM_ROLE_GATE: ${{ secrets.LLM_ROLE_GATE || vars.LLM_ROLE_GATE || 'mistral' }}
          LLM_ROLE_WRITE: ${{ secrets.LLM_ROLE_WRITE || vars.LLM_ROLE_WRITE || 'mistral' }}
          LLM_ROLE_JUDGE: ${{ secrets.LLM_ROLE_JUDGE || vars.LLM_ROLE_JUDGE || 'mistral' }}
          LLM_ROLE_VISION: ${{ secrets.LLM_ROLE_VISION || vars.LLM_ROLE_VISION || 'gemini' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL_HEAVY: ${{ secrets.MISTRAL_MODEL_HEAVY || vars.MISTRAL_MODEL_HEAVY || 'mistral-small-latest' }}
          MISTRAL_MODEL_LIGHT: ${{ secrets.MISTRAL_MODEL_LIGHT || vars.MISTRAL_MODEL_LIGHT || 'open-mistral-nemo' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Model ids set locally must reach the runner too; without these the cloud silently used the
          # code's built-in defaults whatever .env said.
          GROQ_MODEL_VISION: ${{ secrets.GROQ_MODEL_VISION || vars.GROQ_MODEL_VISION }}
          OPENROUTER_MODEL_VISION: ${{ secrets.OPENROUTER_MODEL_VISION || vars.OPENROUTER_MODEL_VISION }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_MAX_TOKENS: "32000"      # a full script in JSON runs 5-8k tokens; 4096 truncated it
          GEMINI_OUTPUT_CAP: "8192"        # Flash's real output ceiling, thinking included
          GEMINI_THINKING_BUDGET: "1536"   # leaves ~6.6k tokens for the answer itself
          LLM_TIMEOUT_LIGHT_MS: "150000"   # classification-sized calls fail fast
          LLM_TIMEOUT_HEAVY_MS: "420000"   # research and script writing need minutes
          SCENE_BAR: "7.5"               # every scene must clear this before the next is judged
          MIN_IMG_W: "1600"              # no stretched small photos
          MIN_VID_W: "1280"              # no soft low-res clips
          AI_CLIPS: ${{ secrets.AI_CLIPS || vars.AI_CLIPS || 'false' }}   # free generated clips as filler; see SETUP.md
          AI_CLIPS_MAX: "4"                            # per run, because generation is slow and capped
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL_HEAVY: ${{ secrets.CLAUDE_MODEL_HEAVY }}
          CLAUDE_MODEL_LIGHT: ${{ secrets.CLAUDE_MODEL_LIGHT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_HEAVY: ${{ secrets.GEMINI_MODEL_HEAVY }}
          GEMINI_MODEL_LIGHT: ${{ secrets.GEMINI_MODEL_LIGHT }}
          OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_MODEL_HEAVY: ${{ secrets.OPENAI_COMPAT_MODEL_HEAVY }}
          OPENAI_COMPAT_MODEL_LIGHT: ${{ secrets.OPENAI_COMPAT_MODEL_LIGHT }}
          OPENAI_COMPAT_VISION: ${{ secrets.OPENAI_COMPAT_VISION }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save a finished render awaiting its final check
        # Written by produce only when Gemini was unavailable at the final check; the next run
        # downloads this by run id and resumes there, instead of re-rendering.
        if: always() && hashFiles('work/pending/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pending-render-${{ github.run_id }}
          path: work/pending/
          retention-days: 14
          compression-level: 0
      - name: Debug artifacts (scripts, captions, thumbnail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-${{ github.run_id }}
          path: |
            work/**/*.json
            work/**/*.srt
            work/**/thumbnail.jpg
            work/**/contact-*.jpg
            work/**/review-pack.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Dry-run videos
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            work/**/final.mp4
            work/**/short.mp4
          retention-days: 3
          if-no-files-found: ignore
