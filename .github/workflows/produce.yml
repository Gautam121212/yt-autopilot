name: produce
on:
  schedule:
    # GitHub drops or delays scheduled runs at the top of the hour under load ("high load times
    # include the start of every hour" — Actions docs), so never use minute 0. Two staggered
    # entries every 2 hours: 12 chances a day, and a dropped one costs nothing because a run that
    # finds the day already won exits in seconds.
    - cron: "23 1-23/2 * * *"
    - cron: "47 0-22/2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but do not upload (videos attached as artifact)"
        type: boolean
        default: true
      sub_niche:
        description: "Force a sub-niche id (optional)"
        required: false
      force:
        description: "Ignore the weekly failure cap"
        type: boolean
        default: false
concurrency: { group: produce, cancel-in-progress: false }
permissions: { contents: read, issues: write }
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
      - run: npm ci
      - name: Install Claude Code CLI (only when using a Claude subscription)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        run: '[ "$LLM_PROVIDER" = "claude-code" ] && npm install -g @anthropic-ai/claude-code || echo "skipped"'
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: kokoro-v1-q8
      - run: npm run produce
        timeout-minutes: 160
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FORCE_SUB_NICHE: ${{ inputs.sub_niche }}
          FORCE_PRODUCE: ${{ inputs.force }}
          PRODUCE_DEADLINE_MIN: "110"    # our own deadline, below the 160-minute step timeout
          PHASE_BUDGET_MS: "1200000"     # 20 min ceiling on the whole image phase
          SCENE_BUDGET_MS: "90000"       # 90s per scene, then pooled footage
          MIN_TOPIC_SCORE: "7.5"         # average across the six topic axes
          MIN_TOPIC_VISUAL: "0.7"        # share of visual subjects that must exist in stock libraries
          MIN_FEASIBLE: "0.6"            # share of scenes with a findable picture
          SHOT_SECS_H: "7"               # target shot length, long video
          SHOT_SECS_V: "3.5"             # target shot length, Short
          # `npm run github` pushes .env values as SECRETS, so secrets must be read first — reading
          # only `vars` silently ignored everything you configured locally.
          LLM_ROLE_GATE: ${{ secrets.LLM_ROLE_GATE || vars.LLM_ROLE_GATE || 'mistral' }}
          LLM_ROLE_WRITE: ${{ secrets.LLM_ROLE_WRITE || vars.LLM_ROLE_WRITE || 'mistral' }}
          LLM_ROLE_JUDGE: ${{ secrets.LLM_ROLE_JUDGE || vars.LLM_ROLE_JUDGE || 'gemini' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL_HEAVY: ${{ secrets.MISTRAL_MODEL_HEAVY || vars.MISTRAL_MODEL_HEAVY || 'mistral-small-latest' }}
          MISTRAL_MODEL_LIGHT: ${{ secrets.MISTRAL_MODEL_LIGHT || vars.MISTRAL_MODEL_LIGHT || 'open-mistral-nemo' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_OUTPUT_CAP: "8192"        # Flash's real output ceiling, thinking included
          GEMINI_THINKING_BUDGET: "1536"   # leaves ~6.6k tokens for the answer itself
          LLM_TIMEOUT_LIGHT_MS: "150000"   # classification-sized calls fail fast
          LLM_TIMEOUT_HEAVY_MS: "420000"   # research and script writing need minutes
          SCENE_BAR: "7.5"               # every scene must clear this before the next is judged
          MIN_IMG_W: "1600"              # no stretched small photos
          MIN_VID_W: "1280"              # no soft low-res clips
          AI_CLIPS: ${{ secrets.AI_CLIPS || vars.AI_CLIPS || 'false' }}   # free generated clips as filler; see SETUP.md
          AI_CLIPS_MAX: "4"                            # per run, because generation is slow and capped
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL_HEAVY: ${{ secrets.CLAUDE_MODEL_HEAVY }}
          CLAUDE_MODEL_LIGHT: ${{ secrets.CLAUDE_MODEL_LIGHT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_HEAVY: ${{ secrets.GEMINI_MODEL_HEAVY }}
          GEMINI_MODEL_LIGHT: ${{ secrets.GEMINI_MODEL_LIGHT }}
          OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_MODEL_HEAVY: ${{ secrets.OPENAI_COMPAT_MODEL_HEAVY }}
          OPENAI_COMPAT_MODEL_LIGHT: ${{ secrets.OPENAI_COMPAT_MODEL_LIGHT }}
          OPENAI_COMPAT_VISION: ${{ secrets.OPENAI_COMPAT_VISION }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug artifacts (scripts, captions, thumbnail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-${{ github.run_id }}
          path: |
            work/**/*.json
            work/**/*.srt
            work/**/thumbnail.jpg
            work/**/contact-*.jpg
            work/**/review-pack.md
          retention-days: 7
          if-no-files-found: ignore
      - name: Dry-run videos
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            work/**/final.mp4
            work/**/short.mp4
          retention-days: 3
          if-no-files-found: ignore
