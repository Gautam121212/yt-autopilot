name: learn
on:
  schedule:
    - cron: "0 4 * * 0"   # Sundays
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Claude Code CLI (only when using a Claude subscription)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        run: '[ "$LLM_PROVIDER" = "claude-code" ] && npm install -g @anthropic-ai/claude-code || echo "skipped"'
      - run: npm run learn
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL_HEAVY: ${{ secrets.CLAUDE_MODEL_HEAVY }}
          CLAUDE_MODEL_LIGHT: ${{ secrets.CLAUDE_MODEL_LIGHT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_HEAVY: ${{ secrets.GEMINI_MODEL_HEAVY }}
          GEMINI_MODEL_LIGHT: ${{ secrets.GEMINI_MODEL_LIGHT }}
          OPENAI_COMPAT_BASE_URL: ${{ secrets.OPENAI_COMPAT_BASE_URL }}
          OPENAI_COMPAT_API_KEY: ${{ secrets.OPENAI_COMPAT_API_KEY }}
          OPENAI_COMPAT_MODEL_HEAVY: ${{ secrets.OPENAI_COMPAT_MODEL_HEAVY }}
          OPENAI_COMPAT_MODEL_LIGHT: ${{ secrets.OPENAI_COMPAT_MODEL_LIGHT }}
          OPENAI_COMPAT_VISION: ${{ secrets.OPENAI_COMPAT_VISION }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Read autoApply setting
        id: mode
        run: echo "auto=$(node -e "process.stdout.write(String(require('./config/channel.json').learning.autoApply === true))")" >> "$GITHUB_OUTPUT"
      - name: Apply directly (autoApply = true)
        if: ${{ steps.mode.outputs.auto == 'true' && hashFiles('work/learn-summary.md') != '' }}
        run: |
          git config user.name  "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add config/playbook.md config/learned.json
          git commit -m "learn: $(head -3 work/learn-summary.md | tail -1 | cut -c1-80)" || exit 0
          git push
      - name: Open playbook PR
        if: ${{ steps.mode.outputs.auto != 'true' && hashFiles('work/learn-summary.md') != '' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: learn/playbook-update
          title: "Learning cycle: playbook + sub-niche weights"
          body-path: work/learn-summary.md
          add-paths: |
            config/playbook.md
            config/learned.json
          commit-message: "learn: update playbook and weights"
